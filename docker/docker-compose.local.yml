version: "3.8"

services:
  # ── Local Isolated Database ──────────────────────────────────────────────
  # Automatically pre-seeded with all tables, plans, apps, and schema from Sql/public.sql
  local-postgres:
    container_name: auth-local-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mspkapps
      POSTGRES_PASSWORD: Pranesh82
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - ../Sql/public.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - auth_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mspkapps -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - auth-local-net

  # ── Local Redis Cache ────────────────────────────────────────────────────
  local-redis:
    container_name: auth-local-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth-local-net

  # ── Developer Backend ───────────────────────────────────────────────────
  developer-backend:
    container_name: auth-dev-backend
    build:
      context: ../developerWeb/Backend
    restart: unless-stopped
    env_file:
      - ../envs/local/dev-backend.env.local
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: local-postgres
      DB_PORT: 5432
      DB_PASS: Pranesh82
      REDIS_URL: redis://local-redis:6379/
      FRONTEND_URL: http://localhost:4001
      BACKEND_URL: http://localhost:5000
      CPANEL_URL: http://localhost:4002
    ports:
      - "5000:5000"
    depends_on:
      local-postgres:
        condition: service_healthy
      local-redis:
        condition: service_healthy
    networks:
      - auth-local-net

  # ── CPanel Backend ──────────────────────────────────────────────────────
  cpanel-backend:
    container_name: auth-cpanel-backend
    build:
      context: ../Cpanel/auth-server
    restart: unless-stopped
    env_file:
      - ../envs/local/cpanel-backend.env.local
    environment:
      PORT: 5002
      NODE_ENV: development
      DB_HOST: local-postgres
      DB_PORT: 5432
      DB_PASS: Pranesh82
      REDIS_URL: redis://local-redis:6379/
      FRONTEND_URL: http://localhost:4002
      BACKEND_URL: http://localhost:5002
      AUTH_API_BASE_URL: http://developer-backend:5000
      SECRET_ENCRYPTION_KEY: f4c0721d1d0afd225c0f54058258fb519d7a145fa20ac4531a7a5810659a2e99
    ports:
      - "5002:5002"
    depends_on:
      local-postgres:
        condition: service_healthy
      local-redis:
        condition: service_healthy
    networks:
      - auth-local-net

  # ── Developer Frontend (Containerized preview) ──────────────────────────
  developer-frontend:
    container_name: auth-dev-frontend
    build:
      context: ../developerWeb/authServerWeb
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
        VITE_SUPPORT_EMAIL: authservices.mspk@mspkapps.in
    restart: unless-stopped
    ports:
      - "4001:4000"
    depends_on:
      - developer-backend
    networks:
      - auth-local-net

  # ── CPanel Frontend (Containerized preview) ─────────────────────────────
  cpanel-frontend:
    container_name: auth-cpanel-frontend
    build:
      context: ../Cpanel/CpanelWeb
      args:
        VITE_CPANEL_API_BASE_URL: http://localhost:5002/api/v1/developer
        VITE_MAIN_PORTAL_URL: http://localhost:4001
    restart: unless-stopped
    ports:
      - "4002:4000"
    depends_on:
      - cpanel-backend
    networks:
      - auth-local-net

networks:
  auth-local-net:
    driver: bridge

volumes:
  auth_local_pgdata:

